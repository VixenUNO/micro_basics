version: '3.8'

services:
  facade-service:
    build:
      context: ./facade-service
    ports:
      - "5001:80"
    depends_on:
      - logging-service
      - messages-service

  logging-service:
    build:
      context: ./logging-service
    ports:
      - "5002:80"

  messages-service:
    build:
      context: ./messages-service
    ports:
      - "5003:80"
